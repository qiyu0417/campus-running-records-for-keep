<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Fit Tool v1.4</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <div class="sidebar">
        <h1>Fit Tool v1.4</h1>
        <div class="form-group">
          <label for="mapSource">地图源</label>
          <select id="mapSource"></select>
        </div>
        <div class="form-group" id="mapKeyGroup" style="display: none">
          <label for="mapKeyInput" id="mapKeyLabel">Key</label>
          <input id="mapKeyInput" type="text" placeholder="输入 API Key" autocomplete="off" />
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input id="coordConvert" type="checkbox" />
            <span>坐标纠偏（GCJ-02 → WGS-84）</span>
          </label>
        </div>
        <div class="form-group">
          <label for="hrRest">静息心率</label>
          <input id="hrRest" type="number" min="30" max="120" value="60" />
        </div>
        <div class="form-group">
          <label for="hrMax">最大心率</label>
          <input id="hrMax" type="number" min="100" max="220" value="180" />
        </div>
        <div class="form-group">
          <label for="weightInput">体重（kg）</label>
          <input id="weightInput" type="number" min="30" max="150" step="1" value="65"> <!-- ========== 新增：体重数据 ========== -->
        </div>
        <div class="form-group">
          <label for="routeMode">路线模式</label>
          <select id="routeMode">
            <option value="loop">环形（自动闭合，支持圈数）</option>
            <option value="linear">线性（单程，不闭合）</option>
          </select>
        </div>
        <div class="form-group" id="lapCountGroup">
          <label for="lapCount">圈数（重复次数）</label>
          <input id="lapCount" type="number" min="1" value="1" />
        </div>
        <div class="form-group">
          <label for="exportCount">导出份数</label>
          <input id="exportCount" type="number" min="1" max="10" value="1" />
        </div>
        <div id="exportTimes" class="export-times"></div>
        <div id="distanceInfo" class="distance-info"></div>
        <div class="form-group buttons">
          <button id="getLocationBtn" type="button">尝试获取当前位置</button> <!-- ========== 新增：定位按钮 ========== -->
          <button id="clearRoute" type="button">清除轨迹</button>
          <button id="previewBtn" type="button">预览</button>
          <button id="generateFit" type="button">生成 FIT 文件</button>
        </div>
        <div id="message" class="message"></div>
        <div id="liveInfo" class="live-info"></div>
        <p class="tip">在右侧地图上点击绘制轨迹点，系统会自动连成路线。</p>
      </div>
      <div id="map"></div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./main.js"></script>
  </body>
</html>
